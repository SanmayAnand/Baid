[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "baid"
path = "src/main.rs"

[dependencies]
adapters.workspace = true
cache.workspace = true
dashmap.workspace = true
pack.workspace = true
session.workspace = true
time = { workspace = true, features = ["serde", "parsing", "formatting"] }
anyhow.workspace = true
axum.workspace = true
baid-core.workspace = true
blake3.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
figment = { workspace = true, features = ["toml", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-util.workspace = true
tower-http = { workspace = true, features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
async-trait.workspace = true
baid-core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["io-util", "test-util"] }
toml.workspace = true
figment = { workspace = true, features = ["toml", "env", "test"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
