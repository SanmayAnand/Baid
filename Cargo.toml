[workspace]
resolver = "2"
# Layers (code-architecture.md section 1); a crate depends only on lower layers:
#   binaries:        server, memharness
#   orchestration:   exec, mcp
#   building blocks: cache, session, predict, pack, invalidate,
#                    adapters, telemetry
#   foundation:      baid-core (depends on no other gc crate)
members = [
    "crates/core",
    "crates/cache",
    "crates/session",
    "crates/predict",
    "crates/pack",
    "crates/invalidate",
    "crates/adapters",
    "crates/telemetry",
    "crates/exec",
    "crates/mcp",
    "crates/server",
    "crates/memharness",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# Highest MSRV among the planned dependencies (foyer 0.22 needs 1.91).
rust-version = "1.91"
publish = false

[workspace.dependencies]
# Internal crates
baid-core = { path = "crates/core" }
cache = { path = "crates/cache" }
session = { path = "crates/session" }
predict = { path = "crates/predict" }
pack = { path = "crates/pack" }
invalidate = { path = "crates/invalidate" }
adapters = { path = "crates/adapters" }
telemetry = { path = "crates/telemetry" }
exec = { path = "crates/exec" }
mcp = { path = "crates/mcp" }

# External crates from the dependency table in code-architecture.md section 1.
# Latest stable releases on crates.io as of 2026-11-14. Crates enable features
# where they use them.
ahash = "0.8.12"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = "4.6.7"
dashmap = "6.2.1"
figment = "0.10.19"
foyer = "0.22.6"
futures = "0.3.34"
hdrhistogram = "7.6.0"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
neo4rs = "0.8.0"
object_store = "0.14.2"
opentelemetry-otlp = "0.33.1"
postcard = "1.1.3"
reqwest = { version = "0.13.5", default-features = false }
rmcp = "3.10.0"
rustls = "0.23.46"
serde = "1.0.229"
serde_json = "1.0.154"
smallvec = "1.16.5"
thiserror = "2.0.21"
tiktoken-rs = "0.12.1"
time = "0.3.55"
tokio = "1.54.1"
tokio-util = "0.7.20"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.26"

# Test-only
proptest = "1.12.0"
serde_norway = "0.9.42"
toml = "1.2.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
unwrap_used = "warn"
